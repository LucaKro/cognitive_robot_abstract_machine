[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "challenges"
description = "Solutions to RoboCup@Home challenges, such as GPSR, built on CRAM."
requires-python = ">=3.10"
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "coraplex>=26.10.0",
    "cramph>=26.10.0",
    "krrood>=26.10.0",
    "ortools",
    "semantic_digital_twin>=26.10.0",
    "typing_extensions",
]

[project.urls]
"Source" = 'https://github.com/cram2/cognitive_robot_abstract_machine'
"Bug Tracker" = 'https://github.com/cram2/cognitive_robot_abstract_machine/issues'

[tool.setuptools.packages.find]
where = ["src"]
include = ["challenges*"]

[tool.setuptools.dynamic]
version = {attr = "challenges._version.__version__"}

[dependency-groups]
workspace = [
    "coraplex",
    "cramph",
    "krrood",
    "semantic_digital_twin",
]
