# Posts the discussions waiting in discussion-posts on this notes branch whenever they
# change, then removes the posted ones from it. Written by `python -m github_workflow
# idea file` and by the session log, since a cloud session cannot write Discussions
# itself; the posts are authored by github-actions[bot].
name: Post discussions
on:
  push:
    branches: [github-workflow/notes]
    paths: ["discussion-posts/**"]
permissions:
  contents: write
  discussions: write
concurrency:
  group: post-discussions
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Post the waiting discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ".github/scripts/post-discussions.sh" "discussion-posts" ".github/scripts/discussion-categories.graphql" ".github/scripts/create-discussion.graphql" ".github/scripts/find-discussions.graphql" ".github/scripts/add-discussion-comment.graphql" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" ".github/scripts/commit-notes-branch.sh"
